<script>
/* ===== app.js ===== */
/* Honeymiood — Global App Behaviour
   Navigation active-state, mobile menu toggle, language helper.
   No storage of any kind is used here — nothing to write to
   localStorage/cookies means nothing here ever requires consent. */

(function () {
  "use strict";

  function markActiveNavLink() {
    var here = window.location.pathname.replace(/\/index\.html$/, "/").replace(/\.html$/, "");
    if (here === "") here = "/";
    document.querySelectorAll(".hm-header__nav a[href], .hm-header__mobile-drawer a[href]").forEach(function (link) {
      var href = link.getAttribute("href");
      if (!href) return;
      var normalized = href.replace(/\/index\.html$/, "/").replace(/\.html$/, "");
      if (normalized === here || (href === "index.html" && (here === "/" || here === "/index"))) {
        link.setAttribute("aria-current", "page");
      }
    });
  }

  function initMobileNav() {
    var root = document.querySelector(".hm-root");
    var toggle = document.querySelector(".hm-header__menu-toggle");
    if (!root || !toggle) return;

    toggle.addEventListener("click", function () {
      var open = root.getAttribute("data-nav-open") === "true";
      root.setAttribute("data-nav-open", open ? "false" : "true");
      toggle.setAttribute("aria-expanded", open ? "false" : "true");
    });

    document.querySelectorAll(".hm-header__nav a, .hm-header__mobile-drawer a").forEach(function (link) {
      link.addEventListener("click", function () {
        root.setAttribute("data-nav-open", "false");
        toggle.setAttribute("aria-expanded", "false");
      });
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && root.getAttribute("data-nav-open") === "true") {
        root.setAttribute("data-nav-open", "false");
        toggle.setAttribute("aria-expanded", "false");
        toggle.focus();
      }
    });
  }

  function initHeaderScroll() {
    var header = document.querySelector(".hm-header");
    if (!header) return;

    var hasHeroBg = document.querySelector(".hm-hero-cover");
    if (hasHeroBg) {
      header.classList.add("hm-header--overlay");
      var handleScroll = function () {
        if (window.scrollY > 30) {
          header.classList.add("hm-header--scrolled");
        } else {
          header.classList.remove("hm-header--scrolled");
        }
      };
      window.addEventListener("scroll", handleScroll, { passive: true });
      handleScroll();
    }
  }

  function setFooterYear() {
    document.querySelectorAll("[data-hm-year]").forEach(function (el) {
      el.textContent = new Date().getFullYear();
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    markActiveNavLink();
    initMobileNav();
    initHeaderScroll();
    setFooterYear();
  });
})();

</script>

<script>
/* ===== commerce.js ===== */
/* Honeymiood — Commerce Bridge
   <shop-product> is Cargo Commerce's own custom element; it only
   hydrates (and shows live prices) once Cargo's frontend script has
   registered it. When that script isn't present — local preview, or
   any page not actually served by Cargo — every <shop-product> tag
   is degraded to a plain, honestly-labelled preview button instead
   of silently rendering nothing. Reads only; writes no storage. */

(function () {
  "use strict";

  function isCargoCommerceReady() {
    return typeof customElements !== "undefined" && !!customElements.get("shop-product");
  }

  function degrade(el) {
    if (el.dataset.hmDegraded === "true") return;
    el.dataset.hmDegraded = "true";
    var label = el.getAttribute("button-text") || el.textContent.trim() || "Zobacz ofertę";
    el.textContent = label;
    el.setAttribute("aria-disabled", "true");
    el.setAttribute("role", "note");
    el.classList.add("hm-buy--preview");
  }

  function hydrate(root) {
    var scope = root && root.querySelectorAll ? root : document;
    var tags = scope.querySelectorAll("shop-product");
    if (isCargoCommerceReady()) return;
    tags.forEach(function (el) { degrade(el); });
  }

  window.hmHydrateCommerce = hydrate;

  document.addEventListener("DOMContentLoaded", function () {
    hydrate(document);
  });
})();

</script>

<script>
/* ===== catalog.js ===== */
/* Honeymiood — Catalog Renderer
   Builds the alternating editorial product grid from the single
   PRODUCTS source (assets/js/products-data.js), so the 7-product
   bilingual catalog is authored exactly once. Runs only on pages
   that contain a #hm-catalog container. */

(function () {
  "use strict";

  var LABELS = {
    pl: { consistency: "Konsystencja", usage: "Zastosowanie", details: "Zobacz Partię / Szczegóły",
          whereToBuy: "Gdzie Kupić", buy: "Kup: " },
    en: { consistency: "Consistency", usage: "Usage", details: "View Batch / Details",
          whereToBuy: "Where to Buy", buy: "Add to Cart: " },
    de: { consistency: "Konsistenz", usage: "Verwendung", details: "Ernte / Details ansehen",
          whereToBuy: "Verkaufsstellen", buy: "In den Warenkorb: " }
  };

  function lang() {
    var root = document.querySelector(".hm-root[data-hm-lang]");
    var value = (root && root.getAttribute("data-hm-lang")) || document.documentElement.lang;
    if (value === "de") return "de";
    if (value === "en") return "en";
    return "pl";
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function buildCard(product, currentLang) {
    var d = product[currentLang] || product.pl;
    var t = LABELS[currentLang] || LABELS.pl;
    var whereHref = currentLang === "de" ? "verkaufsstellen.html" : (currentLang === "en" ? "stockists.html" : "gdzie-kupic.html");

    var article = el("article", "hm-product");
    article.id = product.id;

    var media = el("div", "hm-product__media");
    var img = document.createElement("img");
    img.src = product.image;
    img.alt = d.title + (currentLang === "en" ? " honey jar — " : " — słoik miodu, ") + product.origin;
    img.loading = "lazy";
    img.width = 800;
    img.height = 1000;
    media.appendChild(img);
    article.appendChild(media);

    var content = el("div", "hm-product__content");

    content.appendChild(el("span", "hm-badge hm-badge--accent", product.harvest));
    content.appendChild(el("h2", "hm-product__title", d.title));
    content.appendChild(el("p", "hm-product__profile", d.profile));

    var dl = el("dl", "hm-product__meta");
    dl.appendChild(el("dt", null, t.consistency));
    dl.appendChild(el("dd", null, d.consistency));
    dl.appendChild(el("dt", null, t.usage));
    dl.appendChild(el("dd", null, d.usage));
    content.appendChild(dl);

    var buyRow = el("div", "hm-product__actions");
    product.sizes.forEach(function (size) {
      var label = t.buy + size.label;
      var sp = document.createElement("shop-product");
      sp.setAttribute("product", size.product);
      sp.setAttribute("variant", size.variant);
      sp.setAttribute("button-text", label);
      sp.setAttribute("show-price", "true");
      sp.className = "hm-btn hm-btn--primary";
      sp.textContent = label;
      buyRow.appendChild(sp);
    });
    content.appendChild(buyRow);

    var actionRow = el("div", "hm-product__actions");
    var detailsBtn = document.createElement("button");
    detailsBtn.type = "button";
    detailsBtn.className = "hm-btn hm-btn--secondary";
    detailsBtn.setAttribute("data-open-product", product.id);
    detailsBtn.textContent = t.details;
    actionRow.appendChild(detailsBtn);

    var whereLink = document.createElement("a");
    whereLink.className = "hm-btn hm-btn--secondary";
    whereLink.href = whereHref;
    whereLink.textContent = t.whereToBuy;
    actionRow.appendChild(whereLink);

    content.appendChild(actionRow);
    article.appendChild(content);

    return article;
  }

  function renderCatalog() {
    var container = document.getElementById("hm-catalog");
    if (!container || !window.PRODUCTS) return;
    var currentLang = lang();
    var limit = parseInt(container.getAttribute("data-limit"), 10);
    var items = limit ? window.PRODUCTS.slice(0, limit) : window.PRODUCTS;
    items.forEach(function (product) {
      container.appendChild(buildCard(product, currentLang));
    });
    if (window.hmHydrateCommerce) window.hmHydrateCommerce(container);
  }

  document.addEventListener("DOMContentLoaded", renderCatalog);
})();

</script>

<script>
/* ===== modal.js ===== */
/* Honeymiood — Quick-View Modal
   Native <dialog>. Escape closes (handled natively by <dialog>),
   focus is trapped while open, body scroll is locked, and focus
   returns to the trigger on close. No storage of any kind. */

(function () {
  "use strict";

  var modal, lastTrigger, currentLang;

  var LABELS = {
    pl: { profile: "Profil smakowy", consistency: "Konsystencja", usage: "Zastosowanie", origin: "Pochodzenie",
          inquiry: "Zapytaj o ten miód", close: "Zamknij", buy: "Kup: ", subjectPrefix: "Zapytanie o " },
    en: { profile: "Tasting profile", consistency: "Consistency", usage: "Usage", origin: "Origin",
          inquiry: "Ask about this honey", close: "Close", buy: "Add to Cart: ", subjectPrefix: "Inquiry regarding " },
    de: { profile: "Geschmacksprofil", consistency: "Konsistenz", usage: "Verwendung", origin: "Herkunft",
          inquiry: "Diesen Honig anfragen", close: "Schließen", buy: "In den Warenkorb: ", subjectPrefix: "Anfrage zu " }
  };

  function lang() {
    var root = document.querySelector(".hm-root[data-hm-lang]");
    var value = (root && root.getAttribute("data-hm-lang")) || document.documentElement.lang;
    if (value === "de") return "de";
    if (value === "en") return "en";
    return "pl";
  }

  function buildModal() {
    var dialog = document.createElement("dialog");
    dialog.className = "hm-modal hm-root";
    dialog.id = "hm-product-modal";
    dialog.setAttribute("aria-labelledby", "hm-modal-title");
    dialog.innerHTML =
      '<div class="hm-modal__inner">' +
        '<div class="hm-modal__media"><img id="hm-modal-img" alt="" /></div>' +
        '<div class="hm-modal__body">' +
          '<button type="button" class="hm-modal__close modal-close-btn" aria-label="Close">&times;</button>' +
          '<span class="hm-badge" id="hm-modal-harvest"></span>' +
          '<h2 id="hm-modal-title"></h2>' +
          '<p id="hm-modal-subtitle" class="hm-product__price"></p>' +
          '<dl class="hm-product__meta">' +
            '<dt id="hm-modal-profile-label"></dt><dd id="hm-modal-profile"></dd>' +
            '<dt id="hm-modal-consistency-label"></dt><dd id="hm-modal-consistency"></dd>' +
            '<dt id="hm-modal-usage-label"></dt><dd id="hm-modal-usage"></dd>' +
            '<dt id="hm-modal-origin-label"></dt><dd id="hm-modal-origin"></dd>' +
          '</dl>' +
          '<p id="hm-modal-desc"></p>' +
          '<div class="hm-modal__sizes" id="hm-modal-sizes" role="group" aria-label="Size"></div>' +
          '<div class="hm-modal__buy" id="hm-modal-buy"></div>' +
          '<a class="hm-btn hm-btn--secondary hm-btn--block" id="hm-modal-inquiry-btn" href="#"></a>' +
        '</div>' +
      '</div>';
    document.body.appendChild(dialog);
    return dialog;
  }

  function getFocusable() {
    var nodes = modal.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
    return Array.prototype.filter.call(nodes, function (el) {
      return !el.hidden && el.offsetParent !== null;
    });
  }

  function trapFocus(e) {
    if (e.key !== "Tab") return;
    var focusable = getFocusable();
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  function populateModalData(product) {
    var d = product[currentLang] || product.pl;
    var t = LABELS[currentLang];

    modal.querySelector("#hm-modal-harvest").textContent = product.harvest;
    modal.querySelector("#hm-modal-title").textContent = d.title;
    modal.querySelector("#hm-modal-subtitle").textContent = d.subtitle;
    modal.querySelector("#hm-modal-profile-label").textContent = t.profile;
    modal.querySelector("#hm-modal-profile").textContent = d.profile;
    modal.querySelector("#hm-modal-consistency-label").textContent = t.consistency;
    modal.querySelector("#hm-modal-consistency").textContent = d.consistency;
    modal.querySelector("#hm-modal-usage-label").textContent = t.usage;
    modal.querySelector("#hm-modal-usage").textContent = d.usage;
    modal.querySelector("#hm-modal-origin-label").textContent = t.origin;
    modal.querySelector("#hm-modal-origin").textContent = product.origin;
    modal.querySelector("#hm-modal-desc").textContent = d.description;

    var img = modal.querySelector("#hm-modal-img");
    img.src = product.image;
    img.alt = d.title + (currentLang === "en" ? " honey jar — " : " — słoik miodu, ") + product.origin;

    var sizesWrap = modal.querySelector("#hm-modal-sizes");
    var buyWrap = modal.querySelector("#hm-modal-buy");
    sizesWrap.innerHTML = "";
    buyWrap.innerHTML = "";

    product.sizes.forEach(function (size, i) {
      var pill = document.createElement("button");
      pill.type = "button";
      pill.className = "hm-pill";
      pill.textContent = size.label;
      pill.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      pill.addEventListener("click", function () {
        Array.prototype.forEach.call(sizesWrap.querySelectorAll(".hm-pill"), function (p) {
          p.setAttribute("aria-pressed", "false");
        });
        pill.setAttribute("aria-pressed", "true");
        Array.prototype.forEach.call(buyWrap.querySelectorAll("shop-product"), function (sp, j) {
          sp.hidden = j !== i;
        });
      });
      sizesWrap.appendChild(pill);

      var buyLabel = t.buy + size.label;
      var sp = document.createElement("shop-product");
      sp.setAttribute("product", size.product);
      sp.setAttribute("variant", size.variant);
      sp.setAttribute("button-text", buyLabel);
      sp.setAttribute("show-price", "true");
      sp.className = "hm-btn hm-btn--primary hm-btn--block";
      sp.textContent = buyLabel;
      sp.hidden = i !== 0;
      buyWrap.appendChild(sp);
    });

    if (window.hmHydrateCommerce) window.hmHydrateCommerce(buyWrap);

    var inquiry = modal.querySelector("#hm-modal-inquiry-btn");
    var subject = encodeURIComponent(t.subjectPrefix + d.title);
    inquiry.href = "mailto:honeymiood@gmail.com?subject=" + subject;
    inquiry.textContent = t.inquiry;

    modal.querySelector(".modal-close-btn").setAttribute("aria-label", t.close);
  }

  function openModal(product, trigger) {
    currentLang = lang();
    lastTrigger = trigger || null;
    populateModalData(product);
    modal.showModal();
    document.body.style.overflow = "hidden";
    var focusable = getFocusable();
    (focusable[0] || modal).focus();
    modal.addEventListener("keydown", trapFocus);
  }

  function closeModal() {
    modal.close();
  }

  function initProductModal() {
    modal = buildModal();

    modal.querySelector(".modal-close-btn").addEventListener("click", closeModal);

    modal.addEventListener("click", function (e) {
      if (e.target === modal) closeModal();
    });

    modal.addEventListener("close", function () {
      document.body.style.overflow = "";
      modal.removeEventListener("keydown", trapFocus);
      if (lastTrigger) lastTrigger.focus();
    });

    document.addEventListener("click", function (e) {
      var trigger = e.target.closest && e.target.closest("[data-open-product]");
      if (!trigger) return;
      e.preventDefault();
      var id = trigger.getAttribute("data-open-product");
      var product = (window.PRODUCTS || []).filter(function (p) { return p.id === id; })[0];
      if (product) openModal(product, trigger);
    });
  }

  document.addEventListener("DOMContentLoaded", initProductModal);
})();

</script>
